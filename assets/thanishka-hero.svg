<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thanishka Yogesh | Full-Stack Developer</title>
  <desc id="desc">A black and electric-yellow animated developer profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset=".55" stop-color="#151515"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B89B00"/>
      <stop offset=".48" stop-color="#FFEA00"/>
      <stop offset="1" stop-color="#FFD600"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFD600" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1040" cy="70" r="180" fill="#FFD600" opacity=".045">
      <animate attributeName="r" values="160;205;160" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="70" r="126" fill="none" stroke="#FFD600" stroke-opacity=".25" stroke-width="1" stroke-dasharray="5 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1040 70" to="360 1040 70" dur="36s" repeatCount="indefinite"/>
    </circle>
    <path d="M760 360 L1040 80 L1200 80" fill="none" stroke="#FFD600" stroke-opacity=".24" stroke-width="2"/>
    <path d="M820 360 L1080 100 L1200 100" fill="none" stroke="#FFD600" stroke-opacity=".12" stroke-width="1"/>
    <g fill="#FFD600" opacity=".8">
      <circle cx="930" cy="250" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="190" r="2"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="285" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
    <text x="78" y="78" fill="#FFD600" font-family="monospace" font-size="14" letter-spacing="5">PORTFOLIO / DEVELOPER PROFILE</text>
    <text x="74" y="166" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">THANISHKA</text>
    <text x="78" y="218" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="5">YOGESH</text>
    <rect x="78" y="244" width="390" height="4" rx="2" fill="url(#electric)" filter="url(#glow)">
      <animate attributeName="width" values="250;390;250" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="78" y="282" fill="#E6E6E6" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1">WEB DEVELOPER  ·  FULL-STACK DEVELOPER</text>
    <text x="78" y="311" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1">CSE STUDENT</text>
    <text x="78" y="340" fill="#AFAFAF" font-family="monospace" font-size="12" letter-spacing="2">BUILDING IDEAS INTO EXPERIENCES_</text>
    <path d="M650 292 C760 292 760 205 850 205 S950 118 1030 118 S1110 45 1190 45" fill="none" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 12" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-80" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#FFEA00" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M650 292 C760 292 760 205 850 205 S950 118 1030 118 S1110 45 1190 45"/>
    </circle>
    <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="#FFD600" stroke-opacity=".5"/>
  </g>
</svg>
